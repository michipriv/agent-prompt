# deploy.yaml — Sync-Konfiguration agent-prompt
#
# Zweck:
#   Synchronisiert die globale Claude-Konfiguration (~/.claude/) in dieses Repo.
#   Quelle: ~/.claude/agents/, ~/.claude/rules/, ~/.claude/CLAUDE.md
#   Ziel:   <repo-root>/agents/, <repo-root>/rules/, <repo-root>/CLAUDE.md
#
# Konfiguration:
#   Alle Pfade und Einstellungen werden aus config.toml im Repo-Root gelesen.
#
# Aufruf (im Repo-Root ausführen):
#
#   Linux:
#     ./bin/sync-claude sync
#
#   Windows:
#     .\bin\sync-claude.exe sync
#
# Nach erfolgreichem Sync:
#   Geänderte Dateien committen und pushen via mcp-git (Bash-Git ist verboten).
#   Beispiel-Workflow:
#     1. git_status prüfen
#     2. git_add  → geänderte Dateien stagen
#     3. git_commit → sachliche Commit-Message auf Deutsch
#     4. git_push → zum Remote (Profil: m.mader, Remote: origin)

sync:
  tool: sync-claude
  mode: sync
  config: config.toml

  source:
    base: "~/.claude"
    paths:
      - agents/
      - rules/
      - CLAUDE.md

  target:
    base: "<repo-root>"
    paths:
      - agents/
      - rules/
      - CLAUDE.md

  binaries:
    linux:   "./bin/sync-claude"
    windows: ".\\bin\\sync-claude.exe"

post_sync:
  action: commit_and_push
  tool: mcp-git
  profile: m.mader
  remote: origin
  branch: master
  note: "Bash-Git ist verboten — ausschließlich mcp-git MCP-Tools verwenden"
